<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Spotter</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Sora:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  :root{--bg:#061014;--ink:#f6fffd;--mut:#9eb4b0;--teal:#2ee6d6;--line:rgba(46,230,214,.16)}
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);font:16px/1.5 Sora,system-ui;background:radial-gradient(80vw 50vw at 110% -10%,rgba(46,230,214,.22),transparent 40%),#061014;min-height:100vh}
  main{max-width:1040px;margin:auto;padding:36px 18px 90px}
  header{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end}
  .brand{color:var(--teal);letter-spacing:.2em;text-transform:uppercase;font-size:12px}
  h1{font:700 56px/1 Fraunces,serif;margin:8px 0}
  .lead{max-width:540px;color:var(--mut)}
  .wallet,.panel{background:rgba(8,18,22,.92);border:1px solid var(--line);border-radius:28px;padding:20px}
  .mono{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;color:#b7fff6}
  button{border:0;border-radius:999px;padding:12px 18px;font-weight:700;cursor:pointer;background:transparent;color:#9ff7ee;border:1px solid rgba(46,230,214,.28)}
  button.on{background:var(--teal);color:#042226;border-color:var(--teal);font-weight:800;box-shadow:0 0 0 4px rgba(46,230,214,.16)}
  .steps{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
  .step{padding:8px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-size:13px}
  .step.on{border-color:var(--teal);color:var(--teal);font-weight:700}
  .grid{display:grid;gap:18px}
  @media(min-width:860px){.grid{grid-template-columns:1.15fr .85fr}}
  label{display:block;margin:12px 0 6px;color:var(--mut);font-size:12px}
  input,textarea{width:100%;border:1px solid var(--line);background:#071416;color:var(--ink);border-radius:18px;padding:14px;font:inherit}
  textarea{min-height:72px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .hint{color:#9ff7ee;margin:0 0 10px}
  .msg{margin-top:14px;min-height:1.3em;color:#7ff5ea}
  .msg.bad{color:#ff8b8b}
  .tag{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .HIT{background:#10382c;color:#3dd68c}.MISS{background:#3a1418;color:#ff6b81}
  .DEAD{background:#3a320f;color:#f5c542}.OPEN,.SUBMITTED{background:#12343c;color:#7ff5ea}
  pre{white-space:pre-wrap;color:#c7deda}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="brand">Studionet 61999</div>
      <h1>Spotter</h1>
      <p class="lead">Three moves. Connect. Open a hunt. Submit a live URL and let the network judge it.</p>
    </div>
    <div class="wallet">
      <div style="color:var(--mut);font-size:12px">Wallet</div>
      <div class="mono" id="who">not connected</div>
      <div class="actions">
        <button id="connectBtn" class="on">1. Connect</button>
        <button id="disconnectBtn" hidden>Disconnect</button>
      </div>
      <div class="mono" id="caddr" style="margin-top:12px"></div>
    </div>
  </header>
  <div class="steps">
    <div class="step on" id="s1">1 Connect</div>
    <div class="step" id="s2">2 Open job</div>
    <div class="step" id="s3">3 Submit URL</div>
    <div class="step" id="s4">4 Judge</div>
    <div class="step" id="s5">5 Read</div>
  </div>
  <p class="hint" id="hint">Step 1: Connect and confirm MetaMask on Studionet 61999.</p>
  <div class="grid">
    <section class="panel">
      <h2>Open a hunt</h2>
      <label>Question</label>
      <textarea id="q">Does example.org say the domain is for documentation examples?</textarea>
      <label>How to decide</label>
      <textarea id="r">HIT if the live page says that. MISS if the page loads but does not. DEAD if it cannot be fetched.</textarea>
      <div class="actions"><button id="openBtn">2. Open job</button></div>
    </section>
    <section class="panel">
      <h2>Close it</h2>
      <label>Job id</label>
      <input id="jid" value="1"/>
      <label>URL</label>
      <input id="url" value="https://example.org"/>
      <div class="actions">
        <button id="subBtn">3. Submit URL</button>
        <button id="judgeBtn">4. Judge</button>
        <button id="readBtn">5. Read</button>
      </div>
    </section>
  </div>
  <p class="msg" id="msg"></p>
  <section class="panel" id="out" style="margin-top:18px"></section>
</main>
<script type="module">
import { createClient } from "https://esm.sh/genlayer-js@0.18.0?bundle";
import { studionet } from "https://esm.sh/genlayer-js@0.18.0/chains?bundle";

const $ = (id) => document.getElementById(id);
const CONTRACT = "0xbAd5ebca394B17Daf395427455c1493bc40CEE0B";
const RPC = "https://studio.genlayer.com/api";
const ZERO = "0x0000000000000000000000000000000000000000";
$("caddr").textContent = CONTRACT;
const readClient = createClient({ chain: studionet, endpoint: RPC, account: ZERO });
let account = null;

function note(text, bad) {
  $("msg").className = bad ? "msg bad" : "msg";
  $("msg").textContent = text;
}
function why(e) {
  const raw = String(e && (e.shortMessage || e.message || e));
  const t = raw.toLowerCase();
  if (t.includes("connect wallet") || t.includes("connect first"))
    return "Wallet is not connected. Press 1. Connect and confirm MetaMask.";
  if (t.includes("user rejected") || t.includes("denied"))
    return "Signature rejected in MetaMask. Press the button again and confirm.";
  if (t.includes("unrecognized chain") || t.includes("0xf22f"))
    return "Wallet is on the wrong network. Switch MetaMask to GenLayer Studio (61999).";
  if (t.includes("already final"))
    return "This job is already closed. Open a new job and use the next id.";
  if (t.includes("submit a url"))
    return "No URL on this job yet. Submit a URL before Judge.";
  if (t.includes("fill every field"))
    return "A required field is empty.";
  if (t.includes("insufficient") || t.includes("funds"))
    return "Not enough GEN. Use the Studio faucet, then retry.";
  if (t.includes("eth_filltransaction"))
    return "Studio RPC does not support eth_fillTransaction. If a 0x hash appeared, the transaction still landed.";
  return raw;
}
function setStep(n) {
  ["s1","s2","s3","s4","s5"].forEach((id, i) => $(id).classList.toggle("on", i + 1 === n));
  ["connectBtn","openBtn","subBtn","judgeBtn","readBtn"].forEach((id) => $(id).classList.remove("on"));
  const map = {1:"connectBtn",2:"openBtn",3:"subBtn",4:"judgeBtn",5:"readBtn"};
  $(map[n]).classList.add("on");
  $("hint").textContent = ({
    1: "Step 1: Connect and confirm MetaMask on Studionet 61999.",
    2: "Step 2: Press Open job, confirm the wallet, wait for the hash.",
    3: "Step 3: Set the job id, keep the URL, press Submit URL.",
    4: "Step 4: Press Judge and wait. The network fetches the page.",
    5: "Step 5: Press Read. Expect HIT, MISS, or DEAD.",
  })[n];
}
function writeClient() {
  if (!account || !window.ethereum) throw new Error("Connect wallet first");
  return createClient({ chain: studionet, endpoint: RPC, account, provider: window.ethereum });
}

$("connectBtn").onclick = async () => {
  try {
    if (!window.ethereum) throw new Error("No wallet in this browser");
    account = (await window.ethereum.request({ method: "eth_requestAccounts" }))[0];
    await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0xf22f" }] });
    $("who").textContent = account;
    $("disconnectBtn").hidden = false;
    note("Connected " + account + " on Studionet 61999.");
    setStep(2);
  } catch (e) { note(why(e), true); }
};
$("disconnectBtn").onclick = () => {
  account = null;
  $("who").textContent = "not connected";
  $("disconnectBtn").hidden = true;
  note("Disconnected. Connect again before sending a transaction.");
  setStep(1);
};

async function send(fn, args) {
  if (!args.every((x) => String(x || "").trim())) throw new Error("Fill every field first");
  note("Sending " + fn + "…");
  const client = writeClient();
  const write = { address: CONTRACT, functionName: fn, args };
  try {
    const estimate = await client.estimateTransactionFeesForWrite(write);
    const tx = await client.writeContract({ ...write, fees: { distribution: estimate.distribution, feeValue: estimate.feeValue } });
    note("Success. " + fn + " sent. Hash: " + tx + ". Wait, then continue.");
    return tx;
  } catch (first) {
    try {
      const tx = await client.writeContract(write);
      note("Success. " + fn + " sent. Hash: " + tx + ". Wait, then continue.");
      return tx;
    } catch (e) {
      throw new Error(why(e) || why(first));
    }
  }
}

$("openBtn").onclick = () => send("open_job", [$("q").value.trim(), $("r").value.trim()]).then(() => setStep(3)).catch((e) => note(why(e), true));
$("subBtn").onclick = () => send("submit_url", [$("jid").value.trim(), $("url").value.trim()]).then(() => setStep(4)).catch((e) => note(why(e), true));
$("judgeBtn").onclick = () => send("judge", [$("jid").value.trim()]).then(() => setStep(5)).catch((e) => note(why(e), true));
$("readBtn").onclick = async () => {
  try {
    note("Reading job…");
    const raw = await readClient.readContract({
      address: CONTRACT, functionName: "get_job", args: [$("jid").value.trim() || "1"], stateStatus: "accepted",
    });
    const data = typeof raw === "string" ? JSON.parse(raw) : raw;
    $("out").innerHTML = `<span class="tag ${data.status || ""}">${data.status || "?"}</span><pre>${JSON.stringify(data, null, 2)}</pre>`;
    note("Success. Job status is " + (data.status || "empty") + ".");
    setStep(5);
  } catch (e) { note(why(e), true); }
};
setStep(1);
</script>
</body>
</html>
