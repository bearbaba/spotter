name: Verify Spotter
on:
  push:
    branches: [main, fix/reviewer-ready-20261012]
  pull_request:
permissions:
  contents: read
jobs:
  static-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build static app
        run: npm run build
      - name: Test frontend safety helpers
        run: npm test
      - name: Parse Python smart contract source
        run: python3 -m py_compile Spotter.py
