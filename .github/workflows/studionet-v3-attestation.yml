name: Verify Spotter V3 on Studionet
on:
  push:
    branches: [feat/spotter-v3-fresh-contract]
    paths:
      - contracts/proofgate.py
      - deployments/studionet-v3.json
      - scripts/verify-studionet-v3.mjs
      - .github/workflows/studionet-v3-attestation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-source-and-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Independently verify V3 contract source and deploy/certificate receipts
        run: node scripts/verify-studionet-v3.mjs
